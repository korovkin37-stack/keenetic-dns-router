name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version and the syntax
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(sed -n "s/^const APP_VERSION = '\(.*\)';/\1/p" app.php)
          [ "$tag" = "$ver" ] || { echo "tag v$tag, but APP_VERSION in app.php is $ver"; exit 1; }
          grep -q "v$ver" index.html || { echo "index.html still shows another version"; exit 1; }
          grep -q "^const JS_VERSION = '$ver';" app.js || { echo "JS_VERSION in app.js is not $ver"; exit 1; }
          node --check app.js
          php -l app.php && php -l ext.php
          python3 -c "import json; json.load(open('lang.ru.json'))"
          sh -n install.sh

      - name: Pack
        run: tar czf dns-router.tar.gz app.php ext.php index.html app.js style.css lang.ru.json

      - name: Release notes from the changelogs
        run: |
          ver="${GITHUB_REF_NAME#v}"
          section() { awk -v v="## $ver" '$0 == v {f=1; next} /^## / {if (f) exit} f' "$1"; }
          en=$(section CHANGELOG.md)
          [ -n "$en" ] || { echo "CHANGELOG.md has no section ## $ver"; exit 1; }
          ru=$(section CHANGELOG.ru.md)
          {
            echo "## What's new"
            echo "$en"
            if [ -n "$ru" ]; then
              echo
              echo "## Что нового"
              echo "$ru"
            fi
            echo
            echo "Install or update: see [README](https://github.com/${GITHUB_REPOSITORY}#install)."
          } > notes.md
          cat notes.md

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dns-router.tar.gz
            install.sh
          body_path: notes.md
          generate_release_notes: true
